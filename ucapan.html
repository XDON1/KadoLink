<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Sebuah pesan kecil untukmu.">
  <meta name="theme-color" content="#ffe4ec">
  <title>Sebuah pesan untukmu — KadoLink</title>

  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/ucapan.css">
</head>
<body>
  <main class="greeting-page">

    <div class="greeting-stage">
      <article class="greeting-card tema-romantic" id="greetingCard">
        <div class="greeting-inner">
          <img class="greeting-photo" id="greetingPhoto" alt="" hidden>
          <span class="greeting-small">Sebuah pesan untuk</span>
          <h1 class="greeting-recipient" id="recipient">Nama penerima</h1>
          <div class="greeting-line" aria-hidden="true"></div>
          <p class="greeting-message" id="message">Pesanmu akan muncul di sini.</p>
          <span class="greeting-sender" id="sender">— Nama kamu</span>
        </div>
      </article>

      <div class="greeting-actions">
        <a href="create.html" class="greeting-button">
          Buat KadoLink sendiri
        </a>
        <button type="button" class="greeting-button is-ghost" id="copyBtn">
          Salin tautan
        </button>
        <button type="button" class="greeting-button is-ghost" id="musicBtn" hidden
                aria-label="Putar musik">
          <span class="music-icon" aria-hidden="true">▶</span>
          <span class="music-label">Putar musik</span>
        </button>
      </div>

      <p class="greeting-note" id="copyStatus" role="status" aria-live="polite"></p>
    </div>

    <audio id="greetingAudio" preload="metadata" loop playsinline></audio>

    <!-- Modal salin tautan (fallback kalau clipboard API tidak tersedia) -->
    <div class="copy-modal" id="copyModal" hidden role="dialog"
         aria-modal="true" aria-labelledby="copyModalTitle">
      <div class="copy-modal-backdrop" data-close-modal></div>
      <div class="copy-modal-panel" role="document">
        <h2 class="copy-modal-title" id="copyModalTitle">Salin tautan</h2>
        <p class="copy-modal-desc">
          Klik kolom di bawah, lalu tekan <kbd>Ctrl</kbd>+<kbd>C</kbd>
          (atau <kbd>⌘</kbd>+<kbd>C</kbd> di Mac).
        </p>
        <input type="text" class="copy-modal-input" id="copyModalInput"
               readonly aria-label="Tautan KadoLink">
        <div class="copy-modal-actions">
          <button type="button" class="greeting-button" id="copyModalSelectAll">
            Pilih semua
          </button>
          <button type="button" class="greeting-button is-ghost" data-close-modal>
            Tutup
          </button>
        </div>
      </div>
    </div>

  </main>

  <script src="js/ucapan.js" defer></script>
</body>
</html>
